name: Build and Release Celenganku

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Celenganku-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows 11 Installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build native Windows app and installer
        shell: powershell
        run: .\desktop\build-windows.ps1

      - name: Prepare Windows release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          Copy-Item -LiteralPath 'desktop\release\single-installer-normal-app\Celenganku-Windows11.exe' -Destination 'release-files\Celenganku-Windows11.exe'

      - name: Upload Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: Celenganku-Windows11-Installer
          path: release-files/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Celenganku-Android
          path: release-files

      - name: Download Windows EXEs
        uses: actions/download-artifact@v4
        with:
          name: Celenganku-Windows11
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Celenganku Build #${{ github.run_number }}"
          body: |
            Build otomatis dari commit `${{ github.sha }}`.

            File rilis:
            File yang tersedia:
            - `app-debug.apk`: aplikasi Android.
            - `Celenganku-Windows11.exe`: installer native Windows 11 satu file dengan aplikasi dan uninstaller tertanam.
                    name: Celenganku-Windows11-Installer
          files: |
            release-files/app-debug.apk
            release-files/Celenganku-Windows11.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
